group 'com.leibangzhu.iris'
version '1.0.0-SNAPSHOT'

apply plugin: 'java'
apply plugin: 'application'

application {
    mainClass = 'com.leibangzhu.iris.demoa.service.AppProvider'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenLocal()
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    implementation project(':demo-a-api')
    implementation 'com.leiwei2094:iris-spring:2022.07.21'
    implementation 'com.leiwei2094:iris-server:2022.07.21'

    implementation 'org.springframework.boot:spring-boot-starter-web:1.5.9.RELEASE'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:1.5.9.RELEASE'
}
