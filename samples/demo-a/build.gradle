group 'com.leibangzhu.iris'
version '1.0.0-SNAPSHOT'

apply plugin: 'java'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenLocal()
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.11'
}
